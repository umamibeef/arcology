<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 348" role="img" aria-label="A tile, its eight neighbours, and the four corner bits shared with them"><style>:root{--gold:#9A6712;--gold-bg:#F0E4CC;--ink:#15191A;--rule:#D9DCD6;--surface:#FBFBF9;--water:#236C7C;--water-bg:#D7E6EA; color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--gold:#DDA43E;--gold-bg:#2A2318;--ink:#E7EBE8;--rule:#272E2F;--surface:#171B1C;--water:#5AB2C4;--water-bg:#16262A;}}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif}.lbl-b{font-size:11.5px;fill:var(--ink);font-weight:600}.lbl-k{font-size:11.5px;fill:var(--water);font-weight:600}</style><rect x="96" y="44" width="86" height="86" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><rect x="182" y="130" width="86" height="86" fill="var(--water-bg)" stroke="var(--water)" stroke-width="2"/><text class="lbl-b" x="139.0" y="91.0" text-anchor="middle">NW</text><rect x="182" y="44" width="86" height="86" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="lbl-b" x="225.0" y="91.0" text-anchor="middle">N</text><rect x="268" y="44" width="86" height="86" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="lbl-b" x="311.0" y="91.0" text-anchor="middle">NE</text><rect x="96" y="130" width="86" height="86" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="lbl-b" x="139.0" y="177.0" text-anchor="middle">W</text><text class="lbl-k" x="225.0" y="177.0" text-anchor="middle">tile</text><rect x="268" y="130" width="86" height="86" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="lbl-b" x="311.0" y="177.0" text-anchor="middle">E</text><rect x="96" y="216" width="86" height="86" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="lbl-b" x="139.0" y="263.0" text-anchor="middle">SW</text><rect x="182" y="216" width="86" height="86" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="lbl-b" x="225.0" y="263.0" text-anchor="middle">S</text><rect x="268" y="216" width="86" height="86" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="lbl-b" x="311.0" y="263.0" text-anchor="middle">SE</text><rect x="182" y="130" width="86" height="86" fill="none" stroke="var(--water)" stroke-width="2"/><circle cx="182" cy="130" r="8" fill="var(--gold)"/><text x="182" y="134" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="var(--gold-bg)">0</text><circle cx="182" cy="216" r="8" fill="var(--gold)"/><text x="182" y="220" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="var(--gold-bg)">1</text><circle cx="268" cy="216" r="8" fill="var(--gold)"/><text x="268" y="220" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="var(--gold-bg)">2</text><circle cx="268" cy="130" r="8" fill="var(--gold)"/><text x="268" y="134" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="var(--gold-bg)">3</text></svg>
