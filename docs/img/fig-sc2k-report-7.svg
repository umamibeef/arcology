<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="The 25-phase simulation cycle: phase 0 bookkeeping, phases 1 and 2 reset the power grid and recompute pollution, phases 3 to 18 scan one sixteenth of the map each, phases 19 to 21 aggregate population and run the economy, phases 22 to 24 run periodic passes."><style>:root{--gold:#9A6712;--gold-bg:#F0E4CC; color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--gold:#DDA43E;--gold-bg:#2A2318;}}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif}</style>
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
        </defs>

        <g>
          <rect x="40" y="96" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <rect x="70" y="96" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <rect x="100" y="96" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <rect x="130" y="96" width="478" height="34" fill="var(--gold-bg)" stroke="var(--gold)" stroke-width="1.6"/>
          <g stroke="var(--gold)" stroke-width=".7" opacity=".55">
            <line x1="160" y1="98" x2="160" y2="128"/><line x1="190" y1="98" x2="190" y2="128"/>
            <line x1="220" y1="98" x2="220" y2="128"/><line x1="250" y1="98" x2="250" y2="128"/>
            <line x1="280" y1="98" x2="280" y2="128"/><line x1="310" y1="98" x2="310" y2="128"/>
            <line x1="340" y1="98" x2="340" y2="128"/><line x1="370" y1="98" x2="370" y2="128"/>
            <line x1="400" y1="98" x2="400" y2="128"/><line x1="430" y1="98" x2="430" y2="128"/>
            <line x1="460" y1="98" x2="460" y2="128"/><line x1="490" y1="98" x2="490" y2="128"/>
            <line x1="520" y1="98" x2="520" y2="128"/><line x1="550" y1="98" x2="550" y2="128"/>
            <line x1="580" y1="98" x2="580" y2="128"/>
          </g>
          <rect x="610" y="96" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <rect x="640" y="96" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <rect x="670" y="96" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <rect x="700" y="96" width="88" height="34" fill="none" stroke="currentColor" stroke-width="1.2"/>
        </g>

        <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor" text-anchor="middle">
          <text x="54" y="118">0</text><text x="84" y="118">1</text><text x="114" y="118">2</text>
          <text x="369" y="118" fill="var(--gold)" font-size="12">3 — 18</text>
          <text x="624" y="118">19</text><text x="654" y="118">20</text><text x="684" y="118">21</text>
          <text x="744" y="118">22 — 24</text>
        </g>

        <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="currentColor" opacity=".72">
          <line x1="54" y1="134" x2="54" y2="150" stroke="currentColor" stroke-width=".8" opacity=".5"/>
          <text x="46" y="164" text-anchor="start">title bar, menus</text>
          <line x1="84" y1="134" x2="84" y2="176" stroke="currentColor" stroke-width=".8" opacity=".5"/>
          <text x="76" y="190" text-anchor="start">clear power flags</text>
          <line x1="114" y1="134" x2="114" y2="202" stroke="currentColor" stroke-width=".8" opacity=".5"/>
          <text x="106" y="216" text-anchor="start">pollution + traffic</text>
          <line x1="624" y1="134" x2="624" y2="150" stroke="currentColor" stroke-width=".8" opacity=".5"/>
          <text x="616" y="164" text-anchor="start">traffic total</text>
          <line x1="654" y1="134" x2="654" y2="176" stroke="currentColor" stroke-width=".8" opacity=".5"/>
          <text x="646" y="190" text-anchor="start">water flood fill</text>
          <line x1="684" y1="134" x2="684" y2="202" stroke="currentColor" stroke-width=".8" opacity=".5"/>
          <text x="676" y="216" text-anchor="start">population → RCI → economy</text>
        </g>

        <g stroke="var(--gold)" stroke-width="1.4" fill="none">
          <path d="M130,78 L130,68 L608,68 L608,78"/>
        </g>
        <text x="369" y="56" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
              font-size="14" font-weight="600" fill="var(--gold)">mapScanBlock — one of 16 map blocks per day</text>

        <path d="M600,88 C640,74 660,74 682,88" stroke="currentColor" stroke-width="1.2" fill="none"
              marker-end="url(#ah)" opacity=".75"/>
        <text x="641" y="70" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
              font-size="10" fill="currentColor" opacity=".75">accum8[] drains</text>

        <text x="40" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5"
              fill="currentColor" opacity=".55">date % 25 →</text>
        <path d="M790,113 L820,113 L820,32 L36,32 L36,105" stroke="currentColor" stroke-width="1"
              fill="none" stroke-dasharray="3 3" marker-end="url(#ah)" opacity=".45"/>
      </svg>
