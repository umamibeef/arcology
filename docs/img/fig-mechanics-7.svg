/text><rect x="354" y="168" width="54" height="54" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="num" x="381.0" y="200.0" text-anchor="middle" fill="var(--muted)">5</text><rect x="408" y="168" width="54" height="54" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="num" x="435.0" y="200.0" text-anchor="middle" fill="var(--muted)">5</text><text class="cap" x="381.0" y="46" text-anchor="middle">the tile comes up a step</text><line x1="222" y1="141" x2="278" y2="141" stroke="var(--muted)" stroke-width="2"/><path d="M278 141 l-9 -5 v10 z" fill="var(--muted)"/><text class="lbl-b" x="250" y="126" text-anchor="middle">$32</text><text class="lbl" x="121" y="255" text-anchor="middle">mask 15 — a pit</text><text class="lbl" x="381" y="255" text-anchor="middle">mask 0 — flat again</text><rect x="94" y="114" width="54" height="54" fill="none" stroke="var(--rust)" stroke-width="2"/><rect x="354" y="114" width="54" height="54" fill="none" stroke="var(--moss)" stroke-width="2"/></svg>
