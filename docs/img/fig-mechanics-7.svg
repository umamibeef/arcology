<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="A tile lower than all eight neighbours is raised one step rather than given a slope"><style>:root{--faint:#8C9490;--ink:#15191A;--moss:#5C7530;--moss-bg:#E2EAD3;--muted:#5D6663;--rule:#D9DCD6;--rust:#9C462C;--rust-bg:#F4DED6;--surface:#FBFBF9; color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--faint:#6B7472;--ink:#E7EBE8;--moss:#9AB962;--moss-bg:#1B2417;--muted:#8B9491;--rule:#272E2F;--rust:#D07C5E;--rust-bg:#2B1C16;--surface:#171B1C;}}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif}.cap{font-size:11px;fill:var(--faint);letter-spacing:.08em;text-transform:uppercase;font-weight:600}.lbl{font-size:11.5px;fill:var(--muted)}.lbl-b{font-size:11.5px;fill:var(--ink);font-weight:600}.num{font-size:13px;fill:var(--ink);font-weight:600}</style><rect x="40" y="60" width="54" height="54" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><rect x="94" y="114" width="54" height="54" fill="var(--rust-bg)" stroke="var(--rust)" stroke-width="2"/><rect x="354" y="114" width="54" height="54" fill="var(--moss-bg)" stroke="var(--moss)" stroke-width="2"/><text class="num" x="67.0" y="92.0" text-anchor="middle" fill="var(--muted)">5</text><rect x="94" y="60" width="54" height="54" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="num" x="121.0" y="92.0" text-anchor="middle" fill="var(--muted)">5</text><rect x="148" y="60" width="54" height="54" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="num" x="175.0" y="92.0" text-anchor="middle" fill="var(--muted)">5</text><rect x="40" y="114" width="54" height="54" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text class="num" x="67.0" y="146.0" text-anchor="middle" fill="var(--muted)">5</text><text class="num" x="121.0" y="146.0" text-anchor="middle" fill="var(--rust)">4</text><rect x="148" y="114" width="54" height="54" fill="var(--surface)" stroke="var(--rule)"