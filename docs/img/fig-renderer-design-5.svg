<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Three asset sources feed an offline extractor that emits an indexed PNG atlas and a JSON sidecar; the runtime loader merges mod overrides on top and uploads one GPU texture."><style>:root{--gold:#9A6712; color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--gold:#DDA43E;}}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif}</style>
      <defs>
        <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
        </marker>
      </defs>
      <text x="20" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.4" fill="currentColor" opacity=".55">SOURCES</text>
      <text x="258" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.4" fill="currentColor" opacity=".55">OFFLINE</text>
      <text x="500" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.4" fill="currentColor" opacity=".55">RUNTIME</text>
      <line x1="20" y1="34" x2="740" y2="34" stroke="currentColor" stroke-width="1" opacity=".22"/>

      <rect x="20" y="52" width="182" height="42" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="32" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor">sc2k.rsrc</text>
      <text x="32" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="currentColor" opacity=".55">TSET · pltt 0</text>

      <rect x="20" y="108" width="182" height="42" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="32" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor">SCURK Artwork/*</text>
      <text x="32" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="currentColor" opacity=".55">52 MIFF packs</text>

      <rect x="20" y="196" width="182" height="42" fill="none" style="stroke:var(--gold)" stroke-width="1.6"/>
      <text x="32" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" style="fill:var(--gold)">mods/<name>/</text>
      <text x="32" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" style="fill:var(--gold)" opacity=".8">tiles.png + .json</text>

      <rect x="258" y="52" width="176" height="98" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="272" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="currentColor">sc2kpack</text>
      <text x="272" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="currentColor" opacity=".65">extract · pack</text>
      <text x="272" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="currentColor" opacity=".65">import-scurk</text>
      <text x="272" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="currentColor" opacity=".65">rect packer</text>

      <rect x="258" y="176" width="176" height="70" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3"/>
      <text x="272" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor">atlas.png</text>
      <text x="272" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="currentColor" opacity=".55">indexed · tRNS 0</text>
      <text x="272" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor">atlas.json</text>

      <rect x="500" y="94" width="176" height="86" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="514" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="currentColor">r_atlas.c</text>
      <text x="514" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="currentColor" opacity=".65">lodepng decode</text>
      <text x="514" y="155" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="currentColor" opacity=".65">merge overrides</text>
      <text x="514" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="currentColor" opacity=".65">premultiply</text>

      <rect x="500" y="212" width="176" height="42" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="514" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor">GPU texture</text>
      <text x="514" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="currentColor" opacity=".55">2048² · one bind</text>

      <line x1="202" y1="73" x2="254" y2="88" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar2)"/>
      <line x1="202" y1="129" x2="254" y2="114" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar2)"/>
      <line x1="346" y1="150" x2="346" y2="172" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar2)"/>
      <text x="354" y="167" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="currentColor" opacity=".55">emits</text>
      <line x1="434" y1="200" x2="496" y2="150" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar2)"/>
      <text x="440" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="currentColor" opacity=".55">loads</text>
      <path d="M202 214 L228 214 L228 274 L588 274 L588 258" fill="none" style="stroke:var(--gold)" stroke-width="1.5" marker-end="url(#ar2)" opacity=".9"/>
      <text x="300" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" style="fill:var(--gold)">overrides, read at startup — no repack</text>
      <line x1="588" y1="180" x2="588" y2="208" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar2)"/>
    </svg>
