<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-label="The simulation advances on a fixed tick and publishes read-only snapshots; the renderer reads two snapshots and interpolates between them, and never writes back."><style>:root{--gold:#9A6712; color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--gold:#DDA43E;}}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif}</style>
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
        </marker>
        <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" style="fill:var(--gold)"/>
        </marker>
      </defs>

      <rect x="20" y="56" width="196" height="112" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="34" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="currentColor">Simulation</text>
      <text x="34" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor" opacity=".72">City *c  (owner)</text>
      <text x="34" y="119" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor" opacity=".72">fixed tick</text>
      <text x="34" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor" opacity=".72">no wall clock</text>
      <text x="34" y="157" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor" opacity=".72">deterministic</text>

      <rect x="296" y="46" width="128" height="58" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
      <text x="310" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="currentColor" opacity=".72">snapshot N−1</text>
      <text x="310" y="89" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="currentColor" opacity=".5">const</text>
      <rect x="296" y="120" width="128" height="58" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="310" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="currentColor">snapshot N</text>
      <text x="310" y="163" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="currentColor" opacity=".5">const</text>

      <rect x="504" y="56" width="196" height="112" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="518" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="currentColor">Renderer</text>
      <text x="518" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor" opacity=".72">const City *</text>
      <text x="518" y="119" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor" opacity=".72">variable frame</text>
      <text x="518" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor" opacity=".72">owns camera</text>
      <text x="518" y="157" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor" opacity=".72">owns atlas</text>

      <line x1="216" y1="97" x2="292" y2="75" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
      <line x1="216" y1="127" x2="292" y2="149" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
      <text x="222" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="currentColor" opacity=".62">publishes</text>

      <line x1="424" y1="75" x2="500" y2="97" style="stroke:var(--gold)" stroke-width="1.6" marker-end="url(#ara)"/>
      <line x1="424" y1="149" x2="500" y2="127" style="stroke:var(--gold)" stroke-width="1.6" marker-end="url(#ara)"/>
      <text x="428" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" style="fill:var(--gold)">lerp(α)</text>

      <path d="M600 180 L600 216 L120 216 L120 180" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4" opacity=".38"/>
      <line x1="348" y1="205" x2="372" y2="229" stroke="currentColor" stroke-width="2" opacity=".55"/>
      <line x1="372" y1="205" x2="348" y2="229" stroke="currentColor" stroke-width="2" opacity=".55"/>
      <text x="392" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="currentColor" opacity=".55">the renderer never writes back</text>
      <text x="20" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="currentColor" opacity=".45">α = fraction of the tick elapsed at frame time</text>
    </svg>
